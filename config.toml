# MineRStatus Configuration
# Priority: config.toml > Environment Variables (MINESTATUS_*) > Default Values

[server]
# Server bind address
# Env: MINESTATUS_HOST
host = "0.0.0.0"

# Server listen port
# Env: MINESTATUS_PORT
port = 3000

[cache]
# Response cache time-to-live in seconds (default: 600 = 10 minutes)
# Env: MINESTATUS_CACHE_TTL
ttl = 600

# Maximum number of cached entries
# Env: MINESTATUS_CACHE_MAX_SIZE
max_size = 100

[query]
# Timeout for DNS resolution and connection in seconds
# Env: MINESTATUS_TIMEOUT
timeout = 8

# Total time budget for a query including retries (seconds).
# Must stay below the platform function execution limit (Vercel Hobby: 10s),
# otherwise the runtime kills the function before the JSON error is returned.
# Env: MINESTATUS_MAX_TOTAL
max_total = 9

[dns]
# Custom DNS servers used for SRV / A-record resolution (IPv4 or IPv6).
# Up to three: one primary and two secondary. Leave empty to use the system DNS.
# Env: MINESTATUS_DNS_PRIMARY / MINESTATUS_DNS_SECONDARY1 / MINESTATUS_DNS_SECONDARY2
primary = "1.1.1.1"
secondary1 = ""
secondary2 = ""