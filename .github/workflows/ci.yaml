name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tests/clippy run with --no-default-features because the `vercel`
      # feature links the upstream `vercel_runtime` crate, which fails to
      # compile outside Vercel's own build environment. The local axum
      # server build is what CI exercises here.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-default-features